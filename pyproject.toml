[project]
name = "rugby"
version = "0.1.0"
description = "Men's international rugby union match predictor: Elo, World Rugby rankings and 20-feature models, tested walk-forward"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rugby"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
